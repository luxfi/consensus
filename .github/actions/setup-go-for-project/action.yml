name: Set up project Go toolchain
description: Use the exact Go toolchain provisioned on the Forge runner

runs:
  using: composite
  steps:
    - name: Activate project Go toolchain
      shell: bash
      run: |
        set -euo pipefail
        version=$(awk '$1 == "go" { print $2; exit }' go.mod)
        case "${RUNNER_ARCH:-X64}" in
          X64) arch=x64 ;;
          ARM64) arch=arm64 ;;
          *) echo "unsupported runner architecture: ${RUNNER_ARCH:-unset}" >&2; exit 1 ;;
        esac
        root="/opt/hostedtoolcache/go/$version/$arch"
        test -x "$root/bin/go" || {
          echo "Go $version for $arch is not provisioned at $root" >&2
          exit 1
        }
        echo "$root/bin" >> "$GITHUB_PATH"
        echo "GOROOT=$root" >> "$GITHUB_ENV"
        "$root/bin/go" version
